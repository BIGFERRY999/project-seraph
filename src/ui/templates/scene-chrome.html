  <div id="cesiumContainer"></div>

  <div id="defcon-indicator" style="position: absolute; top: 16px; right: 180px; display: flex; align-items: center; gap: 8px; z-index: 10; background: rgba(10, 14, 23, 0.85); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 6px; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; backdrop-filter: blur(8px);">

    <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>

  <div id="style-indicator">

    <span class="indicator-value" id="active-style-name">NORMAL</span>

  <!-- Top-center camera and share actions -->
  <nav id="top-center-actions" aria-label="Globe actions">
    <button id="tactical-audio-btn" type="button" aria-label="Toggle tactical sonar audio" title="Toggle tactical sonar audio">
      <span class="material-symbols-outlined" aria-hidden="true">radio</span>
    </button>
    <button id="clear-selected-layers" type="button" aria-label="Clear selected data layers" title="Turn off all selected data layers">
      <span class="material-symbols-outlined" aria-hidden="true">layers_clear</span>
    </button>
    <button id="share-btn" type="button" aria-label="Copy share link" title="Copy share link">
      <span class="share-icon" aria-hidden="true">&#x1F517;</span>
    </button>

    </button>
    <button id="north-up-view" type="button" aria-label="Reset map to north up" title="Reset map bearing to north">
